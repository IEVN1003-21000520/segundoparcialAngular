<div class="max-w-2xl mx-auto p-6 bg-white rounded-lg shadow">
 
  <h1 class="text-3xl font-bold text-gray-900 mb-6">
    Lista alumnos
  </h1>
 
  <form [formGroup]="formulario">
 
<!-- Matricula -->
    <div class="mb-5">
 
      <label
        for="matricula"
        class="block mb-2 text-sm font-medium text-gray-900"
      >
        Matricula
      </label>
 
      <input
        type="text"
        id="matricula"
        name="matricula"
        formControlName="matricula"
        required
        class="bg-gray-50 border border-gray-300 text-gray-900 text-sm rounded-lg
               focus:ring-blue-500 focus:border-blue-500 block w-full p-2.5"
        placeholder="Matricula"
      >
    </div>
 
    <!-- Nombre -->
    <div class="mb-5">
 
      <label
        for="name"
        class="block mb-2 text-sm font-medium text-gray-900"
      >
        Nombre
      </label>
 
      <input
        type="text"
        id="nombre"
        name="nombre"
        formControlName="nombre"
        required
        class="bg-gray-50 border border-gray-300 text-gray-900 text-sm rounded-lg
               focus:ring-blue-500 focus:border-blue-500 block w-full p-2.5"
        placeholder="Nombre"
      >
      </div>
 
<!-- Correo -->
    <div class="mb-5">
 
      <label
        for="correo"
        class="block mb-2 text-sm font-medium text-gray-900"
      >
        Correo
      </label>
 
      <input
        type="text"
        id="correo"
        name="correo"
        formControlName="correo"
        required
        class="bg-gray-50 border border-gray-300 text-gray-900 text-sm rounded-lg
               focus:ring-blue-500 focus:border-blue-500 block w-full p-2.5"
        placeholder="Correo"
      >
      </div>
 
      <!-- Materia -->
    <div class="mb-5">
 
      <label
        for="materia"
        class="block mb-2 text-sm font-medium text-gray-900"
      >
        Materia
      </label>
 
      <input
        type="text"
        id="materia"
        name="materia"
        formControlName="materia"
        required
        class="bg-gray-50 border border-gray-300 text-gray-900 text-sm rounded-lg
               focus:ring-blue-500 focus:border-blue-500 block w-full p-2.5"
        placeholder="Materia"
      >
      </div>
 
 
      <div class="flex justify-end mt-5">
 
      <!-- registrar -->
        <button
          type="submit"
          (click)="muestraAlumno()"
 
          class="text-white bg-blue-700 hover:bg-blue-800
                focus:ring-4 focus:outline-none focus:ring-blue-300
                font-medium rounded-lg text-sm px-5 py-2.5
                disabled:opacity-50 disabled:cursor-not-allowed"
        >
          Registrar
        </button>
 
      <!-- cargar -->
        <button
          type="submit"
 
          class="text-white bg-blue-700 hover:bg-blue-800
                focus:ring-4 focus:outline-none focus:ring-blue-300
                font-medium rounded-lg text-sm px-5 py-2.5
                disabled:opacity-50 disabled:cursor-not-allowed"
        >
          Cargar
        </button>
      </div>
  </form>
 
  <div class="mb-5">
    <div>
      <h3 class="text-2xl font-bold text-gray-900 mb-6">Lista de Alumnos</h3>
    </div>
    <h3>Matricula: {{nuevoAlumno.matricula}}</h3>
    <h3>Matricula: {{nuevoAlumno.nombre}}</h3>
    <h3>Matricula: {{nuevoAlumno.correo}}</h3>
    <h3>Matricula: {{nuevoAlumno.materia}}</h3>
  </div>
 
</div>
