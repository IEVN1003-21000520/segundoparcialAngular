<div class="p-6 bg-white border border-gray-200 rounded-xl shadow-lg dark:bg-gray-800 dark:border-gray-700 max-w-7xl mx-auto">
  <!-- Encabezado -->
  <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center pb-5 mb-6 border-b border-gray-200 dark:border-gray-700 gap-4">
    <div>
      <h1 class="text-2xl font-extrabold text-gray-900 dark:text-white tracking-tight">Gestión de Alumnos UTL</h1>
      <p class="text-sm text-gray-500 dark:text-gray-400 mt-1">Consulta, busca, edita o registra nuevos alumnos en el sistema.</p>
    </div>
    <button
      type="button"
      routerLink="/utl/agregar"
      class="text-white bg-pink-600 hover:bg-pink-700 focus:ring-4 focus:outline-none focus:ring-pink-300 font-medium rounded-lg text-sm px-5 py-2.5 inline-flex items-center dark:bg-pink-600 dark:hover:bg-pink-700 dark:focus:ring-pink-800 shadow-sm transition-all"
    >
      <svg class="w-5 h-5 me-2 text-white" aria-hidden="true" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor">
        <path stroke-linecap="round" stroke-linejoin="round" d="M12 4.5v15m7.5-7.5h-15" />
      </svg>
      Agregar Alumno
    </button>
  </div>

  <div class="space-y-6">
    <!-- Barra de búsqueda -->
    <div class="bg-pink-50/50 dark:bg-gray-700/50 p-4 rounded-xl border border-pink-100 dark:border-gray-700 flex flex-col md:flex-row items-center justify-between gap-4">
      <div class="w-full md:w-1/2">
        <label for="table-search" class="sr-only">Buscar</label>
        <div class="relative w-full">
          <div class="absolute inset-y-0 start-0 flex items-center ps-3.5 pointer-events-none">
            <svg class="w-4 h-4 text-pink-500 dark:text-gray-400" aria-hidden="true" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 20 20">
              <path stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="m19 19-4-4m0-7A7 7 0 1 1 1 8a7 7 0 0 1 14 0Z"/>
            </svg>
          </div>
          <input
            id="table-search"
            name="listfilter"
            [(ngModel)]="listfilter"
            type="text"
            class="bg-white border border-gray-300 text-gray-950 text-sm rounded-lg focus:ring-pink-500 focus:border-pink-500 block w-full ps-10 p-3 dark:bg-gray-700 dark:border-gray-600 dark:placeholder-gray-400 dark:text-white dark:focus:ring-pink-500 dark:focus:border-pink-500 shadow-xs"
            placeholder="Ingresa nombre del alumno a filtrar..."
          >
        </div>
      </div>

      <!-- Indicador de Filtro Activo -->
      <div class="w-full md:w-auto text-left md:text-right" *ngIf="listfilter && listfilter.trim() !== ''">
        <span class="inline-flex items-center px-3 py-1.5 rounded-full text-xs font-medium bg-pink-100 text-pink-800 dark:bg-pink-900 dark:text-pink-300">
          Filtro activo: <strong class="ms-1">{{listfilter}}</strong>
        </span>
      </div>
    </div>

    <!-- Tabla de Resultados -->
    <div class="relative overflow-x-auto shadow-md sm:rounded-xl border border-gray-200 dark:border-gray-700">
      <table class="w-full text-sm text-left text-gray-500 dark:text-gray-400" *ngIf="listfilter && listfilter.trim() !== '' && (dataSource | alumnoFilter:listfilter).length > 0">
        <thead class="text-xs text-gray-700 uppercase bg-pink-50 dark:bg-gray-700 dark:text-gray-300">
          <tr>
            <th scope="col" class="px-6 py-4">Matrícula</th>
            <th scope="col" class="px-6 py-4">Nombre</th>
            <th scope="col" class="px-6 py-4">A. Paterno</th>
            <th scope="col" class="px-6 py-4">A. Materno</th>
            <th scope="col" class="px-6 py-4">Correo</th>
            <th scope="col" class="px-6 py-4 text-center">Editar</th>
            <th scope="col" class="px-6 py-4 text-center">Eliminar</th>
          </tr>
        </thead>
        <tbody class="divide-y divide-gray-200 dark:divide-gray-700">
          <tr
            *ngFor="let alumno of dataSource | alumnoFilter:listfilter"
            class="bg-white hover:bg-pink-50/30 dark:bg-gray-800 dark:hover:bg-gray-700/50 transition-colors"
          >
            <td class="px-6 py-4 font-semibold text-gray-900 whitespace-nowrap dark:text-white">
              {{alumno.matricula}}
            </td>
            <td class="px-6 py-4 font-medium text-gray-900 dark:text-white">{{alumno.nombre | uppercase}}</td>
            <td class="px-6 py-4">{{alumno.apaterno}}</td>
            <td class="px-6 py-4">{{alumno.amaterno}}</td>
            <td class="px-6 py-4 text-gray-500 dark:text-gray-400">{{alumno.correo}}</td>
            <td class="px-6 py-4 text-center">
              <button [routerLink]="['/utl/editar', alumno.matricula]" type="button" class="px-3.5 py-2 text-xs font-medium text-center inline-flex items-center text-white bg-pink-500 rounded-lg hover:bg-pink-600 focus:ring-4 focus:outline-none focus:ring-pink-300 dark:bg-pink-600 dark:hover:bg-pink-700 dark:focus:ring-pink-800 transition-all shadow-xs">
                <svg class="w-3.5 h-3.5 me-1.5 text-white" aria-hidden="true" xmlns="http://www.w3.org/2000/svg" fill="currentColor" viewBox="0 0 20 20">
                  <path d="m13.835 7.578-.005.007-7.13 7.13a1 1 0 0 1-.44.251l-3.256.813a1 1 0 0 1-1.217-1.217l.813-3.256a1 1 0 0 1 .251-.44l7.13-7.13.007-.005A3.5 3.5 0 0 1 13.835 7.578ZM12.414 2 15 4.586l1.293-1.293a1 1 0 0 0 0-1.414l-1.172-1.172a1 1 0 0 0-1.414 0L12.414 2Z"/>
                </svg>
                Editar
              </button>
            </td>
            <td class="px-6 py-4 text-center">
              <button [routerLink]="['/utl/eliminar', alumno.matricula]" type="button" class="px-3.5 py-2 text-xs font-medium text-center inline-flex items-center text-white bg-rose-600 rounded-lg hover:bg-rose-700 focus:ring-4 focus:outline-none focus:ring-rose-300 dark:bg-rose-500 dark:hover:bg-rose-600 dark:focus:ring-rose-900 transition-all shadow-xs">
                <svg class="w-3.5 h-3.5 me-1.5 text-white" aria-hidden="true" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 18 20">
                  <path stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M1 5h16M7 8v8m4-8v8M7 1h4a1 1 0 0 1 1 1v3H6V2a1 1 0 0 1 1-1ZM3 5h12l-1 12a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2L3 5Z"/>
                </svg>
                Eliminar
              </button>
            </td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>
</div>
