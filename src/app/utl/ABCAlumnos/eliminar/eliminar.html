<div class="min-h-screen flex justify-center items-center bg-gray-50 p-4">
 
  <!-- Tarjeta (Card) -->
  <!-- Se agregó 'w-full' para que sea responsiva en pantallas muy pequeñas -->
  <div class="bg-neutral-primary-soft block max-w-sm w-full p-6 border border-default rounded-base shadow-xs">
   
    <a href="#">
      <img class="rounded-base w-full h-auto object-cover" src="/img/user.avif" alt="User" />
    </a>
   
    <a href="#">
      <h5 class="mt-6 mb-2 text-2xl font-semibold tracking-tight text-heading">
        Matricula {{regAlumno.matricula}}.
      </h5>
    </a>
   
    <p class="mb-2 text-body">
        Nombre: {{regAlumno.nombre}} |  Apaterno: {{regAlumno.apaterno}}
    </p>
    <p class="mb-2 text-body">
        Amaterno: {{regAlumno.amaterno}}
    </p>
    <p class="mb-2 text-body">
        Corre: {{regAlumno.correo}}
    </p>
   
   
    <a
      href="#"
      class="inline-flex items-center text-body bg-neutral-secondary-medium box-border border border-default-medium hover:bg-neutral-tertiary-medium hover:text-heading focus:ring-4 focus:ring-neutral-tertiary shadow-xs font-medium leading-5 rounded-base text-sm px-4 py-2.5 focus:outline-none transition-colors"
    >
      Cancelar
      <svg
        class="w-4 h-4 ms-1.5 rtl:rotate-180 -me-0.5"
        aria-hidden="true"
        xmlns="http://www.w3.org/2000/svg"
        width="24"
        height="24"
        fill="none"
        viewBox="0 0 24 24"
      >
        <path
          stroke="currentColor"
          stroke-linecap="round"
          stroke-linejoin="round"
          stroke-width="2"
          d="M19 12H5m14 0-4 4m4-4-4-4"
        />
      </svg>
    </a>
 
  </div>
</div>
